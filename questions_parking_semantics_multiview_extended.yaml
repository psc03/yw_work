# 多图扩展版：一个 case 一次请求，各题分别输出；默认 Q01～Q05，Q06 可选。
version: '1.0'
name: qwen_parking_semantics_multiview_extended
language: zh-CN
description: 低速泊车多图扩展版：四道物体识别与定位题，加地面区域及危险边界题；跨视图证据题可选。
usage:
  input: 一个 case 选取同一时刻的多视角图像，先用实际可用的前、左、后、右鱼眼图；缺失视角不补造。
  image_metadata: 每张图附唯一 image_id、真实 camera_id 和已知相机朝向；程序保留各图宽高和时间戳，核实同步关系。
  optional_context: 已知时提供本车前进/倒车/转向意图；未知时不编造，相机朝向不等于行驶方向。
  request: 一次发送 system_prompt、case 上下文、逐张配对的图像说明和图像、joint_prompt，以及 selected_questions 中所选题目的 prompt。不要把整个 YAML
    原文发给模型。
  selected_questions:
  - Q01
  - Q02
  - Q03
  - Q04
  - Q05
  output: 默认按 Q01～Q05 输出五张独立表；启用 Q06 后增加一张证据与不确定性表。定位结果必须附 image_id。
  review: review_focus 和 review_notes 仅用于人工看结果，不发送给模型。
  visualization: 每张图分别生成 Q01 物体点图、Q02 障碍点图、Q03 物体框图、Q04 障碍框图、Q05 地面区域与边界点图。Q06 用于人工阅读。
  image_label_example: image_id=front，camera_id=cam_9，相机朝向=车辆前方；示例字段须替换为实际图像信息。
  optional_questions:
  - Q06
  enable_optional: 需要分析跨视图证据时，将 Q06 加入 selected_questions；一次请求仍按题号分别输出。
system_prompt: |-
  你正在分析同一个低速行驶或泊车场景中、同一时刻的多张车载图像，图像可能存在鱼眼畸变。
  请综合所有图像理解场景，按图分别识别和定位物体，使用简短中文。
  判断类别和通行影响时可以参考其他视图，但只有明确对应的视觉证据才能相互佐证，
  并在可见特征或依据中注明所参考的 image_id；不能把仅在另一张图出现的物体画到本图。
  不把所有可见物体都当成当前障碍；结合通道、入口及已知行驶意图判断。
  未提供行驶意图时，不默认向相机方向行驶，可以报告候选障碍并说明不确定。
  看不清类别或位置时直说，不编造物体、隐藏部分、精确距离或尺寸。
  Q01/Q02 用代表点 point: [x, y]，选在物体可见主体内部、接近视觉中心的位置。
  Q03/Q04 用检测框 bbox: [xmin, ymin, xmax, ymax]，包住物体的可见部分，
  满足 xmin < xmax、ymin < ymax；被遮挡或画面截断的部分不补全。
  每条定位必须带 image_id，坐标在该图内归一化到 0～1000，左上角为原点，x 向右、y 向下。
  不把多张图当作一张拼接图，不跨图复制坐标；点或框无法可靠确定时填 null 并说明原因。
  Q05 定位地面区域或边界：区域取可见区域内部的代表点，边界取可见分界上的一点。
  地表材质变化不一定意味着高差或不可通行；区分区域语义、可见几何风险与通行判断。
joint_prompt: |
  请在一次回答中按所选题号分别输出，每题各用一张表，不要合并。只回答实际提供的问题，未提供的题目不输出。
  Q01 先用一句话描述场景，再列各图中全部物体的代表点表：
  编号｜物体名称｜image_id｜point [x, y]｜可见特征
  Q02 列通行障碍的代表点表：
  编号｜物体名称｜image_id｜point [x, y]｜通行影响｜简短依据
  Q03 列各图中全部物体的检测框表：
  编号｜物体名称｜image_id｜bbox [xmin, ymin, xmax, ymax]｜可见特征
  Q04 列通行障碍的检测框表：
  编号｜物体名称｜image_id｜bbox [xmin, ymin, xmax, ymax]｜通行影响｜简短依据
  按图分配观察编号，例如 front_001、left_001。同图中不同实例分别列出。
  不要求跨视角合并物体；即使同一物体出现在两张图，也分别编号和定位。
  密集且无法逐一分辨时可写“一组”，不要编造数量。
  Q01～Q04 共用观察编号和名称。Q03 对应 Q01 的清单，Q04 对应 Q02 的清单。
  Q02 复用 Q01 中同一观察的 image_id 和点，Q04 复用 Q03 中同一观察的 image_id 和框。
  各表完整写出字段，不能只写“同上”或引用另一张表。
  通行影响填写“明显阻挡／可能限制／无法判断”，Q02 与 Q04 保持相同判断。
  未见直接影响的对象仅保留在 Q01、Q03。
  没有发现明确或候选障碍时，Q02、Q04 分别写“未发现明确或候选障碍”，不编造条目。
  Q05 单独列地面区域与边界表：
  编号｜区域或边界名称｜类型（区域/边界）｜image_id｜point [x, y]｜风险判断｜简短依据
  按图使用独立编号，例如 front_region_001；Q05 可以补充 Q01 未列出的区域或边界。
  风险判断填写“可见危险／疑似危险／仅见材质变化／无法判断”，不要预设危险一定存在。
  没有相关区域或边界时明确说明，不编造条目。Q05 不输出检测框、整段边界或区域多边形。
  仅在提供 Q06 时，额外输出：
  相关对象或区域｜相关 image_id｜各视图提供的证据｜可确认的判断｜仍不确定的信息
  Q06 可引用前面表中的编号；没有明确跨视图对应证据时直说，不强行建立关联。
questions:
- id: Q01
  capability: 多图场景语义与物体定位
  prompt: |-
    这是什么场景？各张图中有哪些能辨认的物体或固定设施？
    请综合图像识别它们，按图列出名称、image_id 和在对应图中的代表点坐标。
  review_focus: 类别是否正确；原单图中的目标是否识别得更好；点是否落在对应图的物体上；是否跨图编造目标。
- id: Q02
  capability: 多图通行障碍判断
  prompt: |-
    结合所有视图，这些物体中哪些阻挡或可能影响车辆当前的低速通行或泊车？
    请单独列出相关对象的名称、image_id 和代表点，并说明通行影响及可见依据，
    例如占据通道、阻挡入口或限制侧向空间。缺少信息时说明无法判断。
    若另一个视图帮助确认了判断，在依据中注明该视图的 image_id。
  review_focus: 是否减少目标障碍漏检或误判；跨视图证据是否真实对应；是否复用 Q01 的编号和点。
- id: Q03
  capability: 多图全部物体检测框定位
  prompt: |-
    请为 Q01 中的各个物体或固定设施给出所在图像的 image_id 和检测框，单独输出一张表。
    框应包住对应图中对象的可见部分，不是只框代表点附近；注明遮挡或截断情况。
  review_focus: 是否与 Q01 观察记录对应；框是否属于正确图片；是否覆盖可见物体并排除相邻对象。
- id: Q04
  capability: 多图通行障碍检测框定位
  prompt: |-
    请为 Q02 中明确或可能影响通行的障碍物给出所在图像的 image_id 和检测框，
    单独输出一张表，并保留通行影响和判断依据。
    框对应该图中障碍物本身的可见部分，不是它影响的整片通行区域。
  review_focus: 是否与 Q02 的清单对应；是否复用 Q03 中的框；是否错误引用另一视图的坐标。
- id: Q05
  capability: 地面区域与危险边界
  prompt: |-
    各图中是否存在可能限制通行的地面区域或边界，例如路面终止、沟渠、
    台阶落差、土坡，以及铺装地面与其他地表的分界？没有发现也请直说。
    请分别指出它是什么，给出 image_id 和一个代表点，并说明可见风险及依据。
    区域的点选在可见区域内部，边界的点选在可见分界上，不需要检测框。
    区分仅有颜色或材质变化与存在高差、凹陷等危险迹象，不凭颜色断言落差，
    也不要仅因是草地或泥土就判定不能通行；证据不足时回答无法判断。
  review_focus: 是否补充了沟渠、台阶、土坡和路面边界漏检；是否把阴影或材质变化误判成危险；代表点是否正确。
- id: Q06
  capability: 多视角补充证据与不确定性（可选）
  prompt: |-
    哪些对象或危险区域的判断得到了不同视图的共同支持或补充？
    请列出相关对象或区域、相关 image_id，以及每张图具体提供了什么证据。
    哪些信息结合所有视图后仍无法确认，原因是什么？
    没有明确跨视图对应关系时直接说明，不要强行关联，也不要声称已证明比单图更准确。
  review_focus: 是否真正引用可核对的跨视图证据；是否错误关联不同对象；是否具体说明观察局限。
review_notes:
  coordinate_conversion: u = x / 1000 * (W - 1); v = y / 1000 * (H - 1)，必须使用该 image_id 的图像宽高。
  scope: 这是多图语义联合推理，不是三维重建；点和框不代表米制位置或真实地面占据。
  single_image_comparison: 先比较同一目标在原单图中的识别、定位和通行判断；新增视野的目标另行统计，不能只比物体总数。
  observation_count: 不同视图的记录可能对应同一个物体，因此行数不代表场景内不重复的物体数量。
  input_control: 单图和多图对照尽量保持每张原图的处理分辨率、模型版本及生成参数一致，记录实际输入像素。
  interpretation: 多图相互一致不等于正确；相机存在不代表没有盲区，未见障碍不代表安全。
  output_length: 多图五表或六表的回答较长；检查是否截断，必要时提高生成长度上限，不把未输出结果当作没有目标。
  ground_point_scope: Q05 的点仅用于标记区域或边界所在位置，不能据此评价完整区域分割、边界精度或真实高差。
  cross_view_evidence: Q06 是模型自述的证据摘要，多图是否改善仍需在同一目标上对比独立的单图与多图结果。
  prompt_comparison: 加入 Q05 也可能影响同次请求中的 Q01～Q04。比较单图与多图时应使用相同的问题集合，避免把问题变化带来的效果归因于多视图。
