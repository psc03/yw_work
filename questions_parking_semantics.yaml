# 低速泊车语义观察：一个 case 一张图，一次请求，两题分别输出。
version: "1.3"
name: qwen_parking_semantics
language: zh-CN
description: "识别可见物体、给出代表点坐标，并判断它们对当前通行的影响。"

usage:
  input: "一个 case 只选一张图。case_id、image_id 和图像路径由程序记录，不要求模型在每行重复。"
  optional_context: "已知时提供这张图的相机朝向、本车前进/倒车/转向意图；未知时不编造。"
  request: "一次发送 system_prompt、图像及上下文、joint_prompt 和两题的 prompt。不要把整个 YAML 原文发给模型。"
  selected_questions: [Q01, Q02]
  output: "Q01：一句场景描述和全部可辨认物体表；Q02：单独的通行障碍表。每张表都包含代表点坐标。"
  review: "review_focus 仅供人工看结果，不发送给模型。"
  visualization: "分别读取 Q01 和 Q02 的坐标，在同一原图的两份副本上标点，查看全部物体和通行障碍。"

system_prompt: |-
  你正在分析低速行驶或泊车场景中的一张车载图像，图像可能存在鱼眼畸变。
  请根据可见证据识别物体并分析通行影响，使用简短中文。
  不把所有可见物体都当成当前障碍；结合通道、入口及已知行驶意图判断。
  未提供行驶意图时，不默认向相机方向行驶，可以报告候选障碍并说明不确定。
  看不清类别或位置时直说，不编造物体、隐藏部分、精确距离或尺寸。
  位置使用当前图像中的代表点 point: [x, y]，不需要检测框。
  代表点选在物体可见主体内部、接近视觉中心的位置；无法定位时填 null。
  坐标归一化到 0～1000，以该图左上角为原点，x 向右、y 向下。

joint_prompt: |-
  请在一次回答中按 Q01、Q02 分节输出，两题各用一张表，不要合并。
  Q01 先用一句话描述场景，再列物体表：
  编号｜物体名称｜point [x, y]｜可见特征
  Q02 单独列通行障碍表：
  编号｜物体名称｜point [x, y]｜通行影响｜简短依据
  每个可辨认实例一行。同类但不同位置的物体分别编号，例如 obj_001、obj_002。
  密集且无法逐一分辨时可写“一组”，不要编造数量。
  Q02 从 Q01 中选出明确或可能影响通行的对象，复用其编号、名称和坐标，
  但在 Q02 表中完整写出这些字段，不能只写“同上”。
  通行影响填写“明显阻挡／可能限制／无法判断”。未见直接影响的对象仅保留在 Q01。
  没有发现明确或候选障碍时，Q02 写“未发现明确或候选障碍”，不编造表格条目。

questions:
  - id: Q01
    capability: 场景语义与物体定位
    prompt: |-
      这是什么场景？图中有哪些能辨认的物体或固定设施？
      请列出它们的名称，并给出每个对象在这张图中的代表点坐标。
    review_focus: "场景、物体类别是否正确；是否漏掉明显对象；点是否落在对应物体上。"

  - id: Q02
    capability: 当前通行障碍判断
    prompt: |-
      这些物体中，哪些阻挡或可能影响车辆当前的低速通行或泊车？
      请单独列出这些对象的名称和代表点坐标，并说明通行影响及可见依据，
      例如占据通道、阻挡入口或限制侧向空间。只列相关对象，缺少信息时说明无法判断。
    review_focus: "是否找出关键障碍；是否误把背景物体当成阻挡；判断依据是否与图像相符；是否复用 Q01 的编号和坐标。"

review_notes:
  coordinate_conversion: "u = x / 1000 * (W - 1); v = y / 1000 * (H - 1)，W/H 为对应图像宽高。"
  scope: "代表点用于识别定位，不表示地面接触点、物体范围或米制位置。"
  interpretation: "未见直接影响不代表保证安全；联合输出一致也不代表识别一定正确。"
  validation: "用原图叠加点人工检查；这份配置仅供定性观察，不是完整定量评测。"
