# 用于先观察 Qwen 的回答效果，不是定量评测题库。
version: "1.0"
name: qwen_fisheye_qualitative
language: zh-CN
description: "8 道单图问题，覆盖场景语义、可通行区域、精细边界、空间关键点与路径辅助。"

usage:
  input: "一张原始图像；已知时附上相机朝向，如前视、后视、左视或右视。"
  request: "每道题独立调用：system_prompt + 图像及朝向说明 + 当前题目的 prompt。"
  output: "以简短中文自然语言回答；定位题附坐标列表，不强制整段回答使用 JSON。"
  review: "review_focus 仅供人工看结果，不要发给模型。定位结果画回原图后再判断准确性。"
  start_with: [Q01, Q02, Q03, Q04]

system_prompt: |-
  你正在分析低速行驶或停车场景中的车载图像，图像可能存在鱼眼畸变。
  只根据当前图像和提供的相机说明回答，使用简短中文并说明可见依据。
  画面左右不等于车辆左右；没有相机朝向时，只描述画面中的方位。
  不预设障碍物、车位或通路一定存在；没有发现时可以明确回答未发现。
  看不清或被遮挡时回答无法判断，不补猜隐藏物体、轮廓或车位角点。
  仅凭地面外观不能保证车辆实际可通过，不凭单张图猜测精确距离和高度。
  如果问题要求坐标，使用当前图像内的 0～1000 归一化坐标：
  左上角为原点，x 向右、y 向下，点写为 [x, y]。
  多边形按轮廓顺序列点，末点与首点自动相连；折线不自动闭合。
  无法可靠定位时返回 null 并说明原因，不用任意坐标占位。
  回答作为观察模型能力的分析结果，不作为可直接执行的车辆控制指令。

questions:
  - id: Q01
    capability: 场景与物体语义
    prompt: |-
      这是什么场景？图中有哪些主要物体，它们分别位于画面的什么位置？
      请指出哪些物体可能影响车辆通行，并简要描述判断依据。
    review_focus: "场景是否理解正确；物体类别和位置是否正确；是否漏掉明显障碍或编造物体。"

  - id: Q02
    capability: 可通行与受阻区域
    prompt: |-
      从图像看，哪些可见地面区域可能通行，哪些区域有明显阻挡或危险，
      哪些区域无法判断？请按画面位置分别描述，并说明原因。
      注意区分看起来有空地与车辆实际能够通过。
    review_focus: "是否把障碍、非地面或遮挡区域判断成可通行；是否区分视觉通路与整车通过。"

  - id: Q03
    capability: 容易忽略的危险与视觉干扰
    prompt: |-
      图中有没有容易被忽略的潜在危险，例如低台阶、挡车器、细杆、
      沟槽或地面突然终止？如果有，指出位置和可见证据。
      是否有阴影、标线或反光容易被误认为障碍？没有或无法确定也请直说。
    review_focus: "是否识别低矮、细小或负向危险；是否把阴影、反光当作实体障碍。"

  - id: Q04
    capability: 障碍物精细边界
    prompt: |-
      选择图中一个边界较清楚、可能影响通行的障碍物，说明它是什么，
      并用一个按顺序排列的点列表描出它的可见轮廓，尽量贴合边界，
      不要只给矩形检测框，也不要补全被遮挡的部分。
      标明轮廓是否因遮挡或画面截断而不完整；无法定位时返回 null。
    review_focus: "叠加后轮廓是否贴合物体；是否只给了框；是否混入阴影或臆造隐藏轮廓。"

  - id: Q05
    capability: 地面边界与空间关键点
    prompt: |-
      图中哪里能清楚看到障碍物与地面的接触位置，或路面与路沿、墙脚的分界？
      选择最多三处，说明对象或边界类型。孤立接触位置用点表示，
      连续分界用有序折线表示。不要用检测框底边或阴影代替接触位置。
      看不到接触位置时说明无法判断。
    review_focus: "关键点和折线是否落在真实可见接触处；是否误用框底边；是否具备后续地面投影价值。"

  - id: Q06
    capability: 停车位关键点
    prompt: |-
      图中是否有可辨认的停车位？若有，选择一个，给出可见车位入口两端点，
      并描述车位在画面中的延伸方向。哪一侧是入口无法确认时要说明。
      被遮挡或模糊的端点返回 null；没有车位时直接回答未发现可辨认车位。
    review_focus: "是否把普通线条误认成车位；入口端点是否正确；是否编造不可见角点。"

  - id: Q07
    capability: 路径规划辅助判断
    prompt: |-
      图中是否能看出一条连续的、未被明显障碍中断的可见地面通路？
      若有，描述它在画面中从哪里延伸到哪里、两侧受到什么限制，
      以及哪些位置可能需要绕开。若通路受阻或被遮挡，请明确指出。
      要判断一辆真实汽车能否沿这条通路行驶，还缺少哪些关键信息？
      没有目标车位和车辆参数时，不生成具体停车轨迹或驾驶指令。
    review_focus: "描述的通路是否连续；是否忽略车宽、转弯和未知区域；能否指出规划还缺什么信息。"

  - id: Q08
    capability: 不确定性与观察局限
    prompt: |-
      对这张图像，哪些与通行有关的信息是你不能可靠判断的？
      请指出具体位置和原因，例如遮挡、低照、过曝、模糊、鱼眼边缘畸变
      或视角不足。为了减少这些不确定性，最需要补充什么视角或信息？
      不要只给通用免责声明，要结合当前图像回答。
    review_focus: "是否具体指出实际局限；是否过度自信；补充信息的建议是否对应当前场景。"
