# 多图方向性通行分析：四个驶出方向，加左右区域观察；一个 case 一次请求，各题分别标点。
version: "1.2"
name: qwen_parking_directional_multiview
language: zh-CN
description: "给定相机朝向，分析四个驶出方向，并单独检查车辆左右区域的物体、地表和进入风险。"

usage:
  input: 一个 case 选取同一时刻的多视角鱼眼图
  image_metadata: 每张图附唯一 image_id、真实 camera_id 和相机朝向（参考camera_reference）；程序保留各图宽高和时间戳，核实同步关系。
  optional_context: 已知时提供车辆尺寸、转向限制、目标出口或候选路径；没有则不补造。
  request: 一次发送 system_prompt、case 上下文、逐张配对的图像说明和图像、joint_prompt，以及 selected_questions 中所选题目的 prompt。不要把整个 YAML 原文发给模型。
  selected_questions:
  - Q01
  - Q02
  - Q03
  - Q04
  - Q05
  - Q06
  output: 六个独立章节：Q01～Q04 分析四个驶出方向，Q05/Q06 单独分析左侧/右侧区域，各题须附独立表。定位结果必须附 image_id。
  review: usage、camera_reference、review_focus 和 review_notes 仅用于程序使用或人工看结果，不发送给模型。发给模型的相机说明必须对应实际输入图片。
  visualization: 在原图副本上标点，分别查看驶出方向风险和左右区域观察。
  image_label_example: image_id=front，camera_id=cam_9，相机朝向=车辆前方；示例字段须替换为实际图像信息。

camera_reference:
  note: 以下对应本项目四路鱼眼；
  cameras:
    - camera_id: cam_9
      suggested_image_id: front
      facing: 车辆前方
    - camera_id: cam_10
      suggested_image_id: left
      facing: 车辆左侧
    - camera_id: cam_11
      suggested_image_id: rear
      facing: 车辆后方
    - camera_id: cam_12
      suggested_image_id: right
      facing: 车辆右侧
  image_label_template: "image_id={image_id}，camera_id={camera_id}，相机朝向={facing}。随后附上对应图片。"

system_prompt: |-
  输入是本车同一时刻的四路鱼眼图像，请综合分析低速泊车场景中的通行条件，使用简短中文。
  依据每张图提供的相机朝向理解车辆方位，不把画面左右直接当成车辆左右。
  前后左右均相对于本车当前车头；向前为前进，向后为倒车，向左右驶出指转向。
  每个方向均可参考全部图像，但参考其他视图图像才能得出的结论须在回答中说明依据，注明所参考的 image_id。
  既关注影响通行的物体，也关注路面区域、边界和高低差迹象；不要求它们都是独立实体。例如通道阻挡、侧向空间限制、路面终止、沟渠、台阶、土坡和地表变化，但不预设它们存在，并且区分材质变化与几何危险，列出全部可能影响通行的因素。
  “驶过去会发生什么”要结合可见证据作条件性说明，如“若车轮越过此边界，可能……”。
  对每个相关物体、路面区域或边界，给出所在图像 image_id 和 point: [x, y]。
  物体取可见主体内部代表点，区域取内部代表点，边界取可见分界上的点。
  点坐标在对应图内归一化到 0～1000，左上角为原点，x 向右、y 向下。
  无法可靠定位时填 null；不要把多张图当作一张拼接图，不跨图复制坐标；看不清、被遮挡或缺少视角时明确说明，不把未知区域当成畅通空间。

joint_prompt: |-
  一次回答六道题，按 Q01 前方驶出、Q02 后方驶出、Q03 左侧驶出、Q04 右侧驶出、Q05 左侧区域、Q06 右侧区域分别输出，不要合并。每题中的列举标注各用一张表。
  Q01～Q04 回答：
  1. 简述能否考虑驶出：可以说明“存在明显阻挡或危险／可见范围内存在候选通路／证据不足”的情况，允许多项并存，并说明各自对应的位置。
  2. 简述通路或受阻位置、驶出时可能遇到的情况，以及尚不能确认的关键条件。
  有障碍但可见其他候选通路时，要分别说明；发现障碍不等于整个方向完全封闭。
  “存在候选通路”只说明图像中的可能性。
  Q05/Q06 描述该侧区域有什么物体、地表和边界，说明哪些区域可考虑进入、哪些有可见危险、哪些无法判断，以及车身或车轮进入后可能遇到什么。
  六题均单独输出标点表，Q01～Q04 列影响通行的对象，Q05/Q06 可再列上主要区域、边界及相关物体：
  编号｜名称｜类型（物体/路面区域/边界）｜image_id｜point [x, y]｜影响与可能后果｜可见依据
  按图编号，如 front_001。同一目标影响多个方向时，各方向完整列出。
  同一目标在不同图中出现可分别编号，不强制跨视角合并；引用其他视图时在依据中注明 image_id 和编号。
  Q05/Q06 中未见直接风险的区域可注明“未见明显危险”。
  视角不足时仍可列出有证据的风险，并在方向判断中保留未知信息。
  没有发现相关风险时直接说明，不编造表格条目；“未发现”不等于“确认安全”。

questions:
  - id: Q01
    capability: 向前驶出的风险与通行判断
    prompt: |-
      假设本车从当前位置低速向前驶出，前方是否存在可见的候选通路？
      会遇到哪些影响通行的物体、路面区域或边界？若继续驶向它们，可能发生什么？
      对于影响通行的物体、路面区域或边界，请逐项列出，按上述统一表头输出本题的独立标点表。
    review_focus: "是否发现前方及相关侧向风险；是否漏掉路面边界或负向危险；后果是否有可见依据。"

  - id: Q02
    capability: 向后驶出的风险与通行判断
    prompt: |-
      假设本车从当前位置低速倒车驶出，后方是否存在可见的候选通路？
      会遇到哪些影响通行的物体、路面区域或边界？若继续倒向它们，可能发生什么？
      对于影响通行的物体、路面区域或边界，请逐项列出，按上述统一表头输出本题的独立标点表。
    review_focus: "是否按倒车情境判断后方风险；是否遗漏后方植被、沟渠或台阶；是否混淆前后方向。"

  - id: Q03
    capability: 向左转向驶出的风险与通行判断
    prompt: |-
      假设本车准备通过转向向左侧驶出（考虑不同方向和角度），左侧是否存在可见的候选通路？
      哪些物体、路面区域或边界可能限制通行？若继续驶入它们，可能发生什么？
      请结合左视及其他相关视图，关注左侧入口、路面和车身转向时可能受限的位置。对于影响通行的物体、路面区域或边界，请逐项列出，按上述统一表头输出本题的独立标点表。
    review_focus: "是否理解本车左侧；是否综合相关视图；是否区分侧面有空地与车辆能完成转向驶入。"

  - id: Q04
    capability: 向右转向驶出的风险与通行判断
    prompt: |-
      假设本车准备通过转向向右侧驶出（考虑不同方向和角度），右侧是否存在可见的候选通路？
      哪些物体、路面区域或边界可能限制通行？若继续驶入它们，可能发生什么？
      请结合右视及其他相关视图，关注右侧入口、路面和车身转向时可能受限的位置。对于影响通行的物体、路面区域或边界，请逐项列出，按上述统一表头输出本题的独立标点表。
    review_focus: "是否理解本车右侧；是否考虑路面区域及侧向限制；是否给出有依据的条件性后果。"

  - id: Q05
    capability: 车辆左侧区域的内容与进入风险
    prompt: |-
      请观察车辆左侧区域：这里有哪些物体，是什么地面，有没有哪些可见分界或高低差迹象？
      哪些部分可考虑进入，哪些物体、路面区域或边界可能有隐患，哪些无法判断？
      如果车身进入或车轮驶上、越过这些位置，可能遇到什么障碍或发生什么情况？
      对于该侧主要物体、路面区域和边界，请逐项列出，按上述统一表头输出本题的独立标点表。
    review_focus: "是否描述左侧区域的真实内容；是否区分不同地表与边界；是否标出物体和区域；风险是否有证据。"

  - id: Q06
    capability: 车辆右侧区域的内容与进入风险
    prompt: |-
      请观察车辆右侧区域：这里有哪些物体，是什么地面，有没有哪些可见分界或高低差迹象？
      哪些部分可考虑进入，哪些物体、路面区域或边界可能有隐患，哪些无法判断？
      如果车身进入或车轮驶上、越过这些位置，可能遇到什么障碍或发生什么情况？
      对于该侧主要物体、路面区域和边界，请逐项列出，按上述统一表头输出本题的独立标点表。
    review_focus: "是否描述右侧区域的真实内容；是否区分不同地表与边界；是否标出物体和区域；风险是否有证据。"

review_notes:
  coordinate_conversion: "u = x / 1000 * (W - 1); v = y / 1000 * (H - 1)，使用对应 image_id 的图像宽高。"
  annotation_scope: "代表点只标记物体、区域或边界的位置，不表示其完整范围、高差或三维占地。"
  interpretation: "这是方向性视觉风险推理，不是已验证的停车规划或控制结果；后果描述属于条件性预测。"
  context_check: "运行前核实图片朝向与同步；若相机图像有镜像、旋转或裁剪，应明确说明并保留坐标映射。"
  comparison: "检查同一物体在不同驶出方向下的影响解释是否合理变化，而不是要求四个方向给出相同结论。"
  output_length: "检查六题是否完整输出；生成截断不能视为后续方向或区域无障碍。"
