# 一个 case 一张图，一次请求；Q01/Q02 输出点，Q03/Q04 输出框，四题分别输出。
version: "1.0"
name: qwen_parking_semantics_full
language: zh-CN
description: "低速泊车语义观察四题版：全部物体与通行障碍，分别输出代表点和检测框。"

usage:
  input: "一个 case 只选一张图。case_id、image_id 和图像路径由程序记录，不要求模型在每行重复。"
  optional_context: "已知时提供这张图的相机朝向、本车前进/倒车/转向意图；未知时不编造。"
  request: "一次发送 system_prompt、图像及上下文、joint_prompt 和四题的 prompt。不要把整个 YAML 原文发给模型。"
  selected_questions: [Q01, Q02, Q03, Q04]
  output: "按题号分别输出四张表，各表完整写出坐标，便于独立读取。"
  review: "review_focus 仅供人工看结果，不发送给模型。"
  visualization: "分别生成全部物体点图、通行障碍点图、全部物体框图、通行障碍框图。"

system_prompt: |-
  你正在分析低速行驶或泊车场景中的一张车载图像，图像可能存在鱼眼畸变。
  请根据可见证据识别物体并分析通行影响，使用简短中文。
  不把所有可见物体都当成当前障碍；结合通道、入口及已知行驶意图判断。
  未提供行驶意图时，不默认向相机方向行驶，可以报告候选障碍并说明不确定。
  看不清类别或位置时直说，不编造物体、隐藏部分、精确距离或尺寸。
  Q01/Q02 用代表点 point: [x, y]，选在物体可见主体内部、接近视觉中心的位置。
  Q03/Q04 用检测框 bbox: [xmin, ymin, xmax, ymax]，包住物体的可见部分，
  满足 xmin < xmax、ymin < ymax；被遮挡或画面截断的部分不补全。
  所有坐标归一化到 0～1000，以该图左上角为原点，x 向右、y 向下。
  点或框无法可靠确定时填 null，并简要说明原因。

joint_prompt: |-
  请在一次回答中按 Q01、Q02、Q03、Q04 分节输出，每题各用一张表，不要合并。
  Q01 先用一句话描述场景，再列全部物体的代表点表：
  编号｜物体名称｜point [x, y]｜可见特征
  Q02 列通行障碍的代表点表：
  编号｜物体名称｜point [x, y]｜通行影响｜简短依据
  Q03 列全部物体的检测框表：
  编号｜物体名称｜bbox [xmin, ymin, xmax, ymax]｜可见特征
  Q04 列通行障碍的检测框表：
  编号｜物体名称｜bbox [xmin, ymin, xmax, ymax]｜通行影响｜简短依据
  每个可辨认实例一行。同类但不同位置的物体分别编号，例如 obj_001、obj_002。
  密集且无法逐一分辨时可写“一组”，不要编造数量。
  四题共用物体编号和名称。Q03 对应 Q01 的物体清单，Q04 对应 Q02 的障碍清单。
  Q02 复用 Q01 中同一对象的点，Q04 复用 Q03 中同一对象的框。
  各表完整写出字段，不能只写“同上”或引用另一张表。
  通行影响填写“明显阻挡／可能限制／无法判断”，Q02 与 Q04 保持相同判断。
  未见直接影响的对象仅保留在 Q01、Q03。
  没有发现明确或候选障碍时，Q02、Q04 分别写“未发现明确或候选障碍”，不编造条目。

questions:
  - id: Q01
    capability: 场景语义与物体定位
    prompt: |-
      这是什么场景？图中有哪些能辨认的物体或固定设施？
      请列出它们的名称，并给出每个对象在这张图中的代表点坐标。
    review_focus: "场景、物体类别是否正确；是否漏掉明显对象；点是否落在对应物体上。"

  - id: Q02
    capability: 当前通行障碍判断
    prompt: |-
      这些物体中，哪些阻挡或可能影响车辆当前的低速通行或泊车？
      请单独列出这些对象的名称和代表点坐标，并说明通行影响及可见依据，
      例如占据通道、阻挡入口或限制侧向空间。只列相关对象，缺少信息时说明无法判断。
    review_focus: "是否找出关键障碍；是否误把背景物体当成阻挡；判断依据是否与图像相符；是否复用 Q01 的编号和坐标。"

  - id: Q03
    capability: 全部物体检测框定位
    prompt: |-
      请为 Q01 中的各个物体或固定设施给出检测框，单独输出一张表。
      框应包住对象的可见部分，不是只框代表点附近；注明遮挡或截断情况。
    review_focus: "是否与 Q01 的对象一一对应；框是否覆盖正确的物体可见部分；是否混入相邻对象。"

  - id: Q04
    capability: 通行障碍检测框定位
    prompt: |-
      请为 Q02 中明确或可能影响通行的障碍物给出检测框，单独输出一张表，
      并保留通行影响和判断依据。框对应障碍物本身，不是它影响的整片通行区域。
    review_focus: "是否与 Q02 的障碍清单对应；是否复用 Q03 中的框；框是否落在实际障碍物上。"

review_notes:
  coordinate_conversion: "u = x / 1000 * (W - 1); v = y / 1000 * (H - 1)，点和框端点均按此转换。"
  scope: "点为物体可见主体的代表位置，框为可见部分的矩形范围；均不代表米制位置或真实地面占据范围。"
  interpretation: "未见直接影响不代表保证安全；联合输出一致也不代表识别一定正确。"
  validation: "在原图的四份副本上分别叠加各题结果；这份配置用于定性观察，不是点框任务的独立性能对照。"
  output_length: "四张表可能较长；若回答在 Q03/Q04 中途截断，应提高生成长度上限后重新运行，不能当作没有检测结果。"
